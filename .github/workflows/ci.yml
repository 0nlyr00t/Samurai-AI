name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q
        # opt-in suites stay local: SAMURAI_TEST_DOCKER / SAMURAI_TEST_OLLAMA unset

      - name: Eval smoke suite
        run: uv run samurai eval run evals/smoke.json --out eval-report.json

      - name: Package build
        run: uv build

      - name: Reproducible build check
        run: bash packaging/check_reproducible.sh
