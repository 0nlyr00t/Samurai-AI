name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build --out-dir dist/release
      - name: Checksums
        run: |
          cd dist/release
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/release/

  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: samurai-linux-x86_64
            kind: native-linux
            bin: samurai
          - os: ubuntu-latest
            artifact: samurai-linux-arm64
            kind: qemu-linux
            bin: samurai
            platform: linux/arm64
          - os: macos-latest
            artifact: samurai-darwin-arm64
            kind: native-macos
            bin: samurai
          - os: windows-latest
            artifact: samurai-windows-x86_64.exe
            kind: native-windows
            bin: samurai.exe
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        if: matrix.kind != 'qemu-linux'
        with:
          enable-cache: true
      - uses: docker/setup-qemu-action@v3
        if: matrix.kind == 'qemu-linux'
        with:
          platforms: arm64
      - name: Build standalone binary
        if: startsWith(matrix.kind, 'native-')
        run: uv run --group release pyinstaller packaging/samurai.spec --distpath dist/binary --workpath build/pyinstaller --noconfirm
      - name: Build standalone binary (arm64, under QEMU)
        if: matrix.kind == 'qemu-linux'
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$PWD":/src -w /src \
            python:3.12-slim bash -lc "
              apt-get update -qq &&
              apt-get install -y -qq binutils >/dev/null &&
              pip install --quiet uv &&
              uv sync --frozen --group release &&
              uv run --group release pyinstaller packaging/samurai.spec \
                --distpath dist/binary --workpath build/pyinstaller --noconfirm
            "
      - name: Smoke test binary
        if: matrix.kind == 'native-linux' || matrix.kind == 'native-macos'
        shell: bash
        run: ./dist/binary/${{ matrix.bin }} --help
      - name: Smoke test binary (arm64, under QEMU)
        if: matrix.kind == 'qemu-linux'
        shell: bash
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$PWD/dist/binary":/binary python:3.12-slim /binary/${{ matrix.bin }} --help
      - name: Smoke test binary (windows)
        if: matrix.kind == 'native-windows'
        shell: bash
        run: ./dist/binary/${{ matrix.bin }} --help
      - name: Functional smoke (eval suite)
        if: matrix.kind == 'native-linux'
        run: SAMURAI_HOME="$RUNNER_TEMP/samurai-home" ./dist/binary/${{ matrix.bin }} eval run evals/smoke.json --out "$RUNNER_TEMP/eval-report.json"
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist/release
          cp "dist/binary/${{ matrix.bin }}" "dist/release/${{ matrix.artifact }}"
          cd dist/release
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.artifact }}
          path: dist/release/

  sign-and-release:
    needs: [python-dist, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign artifacts (keyless)
        run: |
          cd artifacts
          for file in *; do
            case "$file" in
              *.bundle) continue ;;
            esac
            cosign sign-blob --yes --bundle "$file.bundle" "$file"
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --title "Samurai AI ${{ github.ref_name }}" --generate-notes
