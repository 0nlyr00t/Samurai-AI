[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samurai-ai"
version = "0.1.0"
description = "A governed TUI harness for authorized security operations"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "pydantic>=2.10,<3",
    "textual>=1.0,<7",
]

[project.scripts]
samurai = "samurai_ai.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]
release = [
    "pyinstaller>=6.10,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/samurai_ai"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["samurai_ai"]
mypy_path = "src"
