<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Samurai AI logo</title>
  <desc id="description">A dark geometric emblem with a torii-inspired mark, red moon, and Samurai AI wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="emblem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA8FF"/>
      <stop offset="1" stop-color="#5BC0BE"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="48" fill="#0D1117"/>
  <circle cx="1030" cy="92" r="130" fill="#4FA8FF" opacity="0.06"/>
  <circle cx="1080" cy="310" r="180" fill="#5BC0BE" opacity="0.05"/>

  <rect x="56" y="56" width="288" height="288" rx="64" fill="url(#panel)" stroke="#4FA8FF" stroke-opacity="0.65" stroke-width="3"/>
  <circle cx="238" cy="126" r="42" fill="#E85454" opacity="0.94"/>
  <path d="M116 145 C158 122 242 122 284 145" fill="none" stroke="url(#emblem)" stroke-width="18" stroke-linecap="round"/>
  <path d="M143 174 H257" stroke="#F5F5F5" stroke-width="13" stroke-linecap="round"/>
  <path d="M165 174 V281 M235 174 V281" stroke="#F5F5F5" stroke-width="15" stroke-linecap="round"/>
  <path d="M139 281 H261" stroke="#5BC0BE" stroke-width="11" stroke-linecap="round"/>
  <path d="M111 300 L289 184" stroke="#E85454" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M276 176 L296 188 L278 196" fill="none" stroke="#E85454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="200" cy="200" r="94" fill="none" stroke="#4FA8FF" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="7 11"/>

  <text x="414" y="176" fill="#F5F5F5" font-family="Inter, 'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="9">SAMURAI</text>
  <rect x="421" y="204" width="90" height="38" rx="19" fill="#E85454"/>
  <text x="444" y="232" fill="#FFFFFF" font-family="Inter, 'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="3">AI</text>
  <text x="532" y="232" fill="#5BC0BE" font-family="Inter, 'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="5">OPERATION HARNESS</text>

  <path d="M421 282 H1018" stroke="#263244" stroke-width="2"/>
  <g fill="#888888" font-family="Inter, 'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3">
    <text x="421" y="322">SCOPE</text>
    <circle cx="535" cy="315" r="4" fill="#4FA8FF"/>
    <text x="563" y="322">WORKFLOW</text>
    <circle cx="727" cy="315" r="4" fill="#5BC0BE"/>
    <text x="755" y="322">EVIDENCE</text>
    <circle cx="908" cy="315" r="4" fill="#E85454"/>
    <text x="936" y="322">CONTROL</text>
  </g>
</svg>
