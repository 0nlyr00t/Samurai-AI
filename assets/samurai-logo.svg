<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Samurai AI logo</title>
  <desc id="description">A curved katana swinging up, its cut almost completing a red circle.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#141C28"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C5A68"/>
      <stop offset="0.38" stop-color="#F2F7FC"/>
      <stop offset="0.75" stop-color="#C3D2E0"/>
      <stop offset="1" stop-color="#7E8E9E"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F6FA"/>
      <stop offset="1" stop-color="#9FB0C0"/>
    </linearGradient>
    <linearGradient id="scarf" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FF8181"/>
      <stop offset="1" stop-color="#E85454" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39424E"/>
      <stop offset="1" stop-color="#151B22"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E85454" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#E85454" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#FF8181" stop-opacity="1"/>
      <stop offset="0.9" stop-color="#FF9A9A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF9A9A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="48" fill="#0B0E13"/>
  <rect x="24" y="24" width="1152" height="352" rx="34" fill="url(#panel)" stroke="#22303F"/>
  <circle cx="1010" cy="86" r="150" fill="#4FA8FF" opacity="0.05"/>
  <circle cx="1120" cy="336" r="190" fill="#E85454" opacity="0.04"/>

  <!-- the cut: the circle almost closes, open only where the blade exits -->
  <path d="M353 128 A126 126 0 1 1 322 97" fill="none" stroke="url(#cut)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M347 141 A108 108 0 1 1 320 114" fill="none" stroke="#E85454" stroke-opacity="0.18" stroke-width="3.5" stroke-linecap="round"/>

  <!-- the ninja: low lunge, scarf streaming behind, blade out through the gap -->
  <g transform="translate(190 148) scale(0.72) rotate(-6)">
<g fill="#E6EDF3">
    <path d="M82 22 L56 44 L48 34 L76 10 Z"/>
    <path d="M52 44 L44 58 L36 52 L46 38 Z"/>
    <path d="M80 50 L80 60 L54 88 L44 78 L70 46 Z"/>
    <path d="M46 80 L52 110 L38 114 L32 82 Z"/>
    <path d="M40 104 L18 116 C12 119 11 124 16 126 L36 118 Z"/>
    <path d="M80 8 C92 2 108 4 112 16 L104 62 C102 72 88 76 78 70 C72 58 72 24 76 14 Z"/>
    <path d="M86 58 L90 68 L114 96 L106 104 L84 74 Z"/>
    <path d="M112 92 L128 120 L114 128 L100 100 Z"/>
    <path d="M116 116 L140 126 C146 129 146 135 140 137 L110 127 Z"/>
    <path d="M104 20 L136 38 L132 48 L98 32 Z"/>
    <path d="M92 0 C96 -14 110 -16 118 -6 C124 2 118 12 108 15 C99 17 91 10 92 0 Z"/>
    <path d="M92 10 C88 -6 100 -20 114 -20 C126 -20 133 -10 130 2 C120 10 104 15 92 10 Z"/>
    <path d="M100 3 L122 6 L121 11 L99 9 Z" fill="#0B0E13" opacity="0.62"/>
  </g>
  <path d="M96 14 C78 2 60 10 44 2 L38 14 C56 24 78 22 96 28 Z" fill="#E85454"/>
  <g transform="translate(134 42) rotate(-28)">
    <ellipse rx="11" ry="4.5" fill="#B197FC"/>
    <rect x="-32" y="-3.6" width="28" height="7.2" rx="3.6" fill="#2B333D"/>
    <path d="M0 -3.8 C52 -9 104 -9 146 -4 L158 0 L144 4 C104 7 52 7 0 3.8 Z" fill="url(#steel)"/>
  </g>
  </g>

  <text x="470" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="0.5" fill="#F4F7FA">Samurai AI</text>
  <text x="473" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" letter-spacing="3.6" fill="#8A94A2">ONE SHOT. <tspan fill="#E85454">MANY KILLS.</tspan></text>
</svg>
