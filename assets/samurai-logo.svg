<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Samurai AI logo</title>
  <desc id="description">A curved katana swinging up, its cut almost completing a red circle.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#141C28"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C5A68"/>
      <stop offset="0.38" stop-color="#F2F7FC"/>
      <stop offset="0.75" stop-color="#C3D2E0"/>
      <stop offset="1" stop-color="#7E8E9E"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39424E"/>
      <stop offset="1" stop-color="#151B22"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E85454" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#E85454" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#FF8181" stop-opacity="1"/>
      <stop offset="0.9" stop-color="#FF9A9A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF9A9A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="48" fill="#0B0E13"/>
  <rect x="24" y="24" width="1152" height="352" rx="34" fill="url(#panel)" stroke="#22303F"/>
  <circle cx="1010" cy="86" r="150" fill="#4FA8FF" opacity="0.05"/>
  <circle cx="1120" cy="336" r="190" fill="#E85454" opacity="0.04"/>

  <g transform="translate(56 42)">
    <!-- the cut: the circle almost closes, open only where the blade exits -->
    <path d="M315 131 A138 138 0 1 1 281 97" fill="none" stroke="url(#cut)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M303 137 A118 118 0 1 1 274 110" fill="none" stroke="#E85454" stroke-opacity="0.2" stroke-width="3.5" stroke-linecap="round"/>

    <!-- the katana: curved single-edged blade, round tsuba, wrapped tsuka -->
    <g transform="translate(64 250) rotate(-45)">
      <rect x="-98" y="-11" width="90" height="21" rx="9" fill="url(#hilt)"/>
      <g stroke="#A6B6C6" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
        <path d="M-88 -6 L-76 6"/>
        <path d="M-75 -6 L-63 6"/>
        <path d="M-62 -6 L-50 6"/>
        <path d="M-49 -6 L-37 6"/>
        <path d="M-36 -6 L-24 6"/>
      </g>
      <rect x="-108" y="-12" width="13" height="23" rx="6" fill="#2B333D"/>
      <ellipse cx="-3" cy="0" rx="7" ry="21" fill="#B197FC"/>
      <path d="M0 -14 C54 -38 124 -40 170 -25 L200 -14 L212 -1 L196 5 C148 14 82 14 0 12 Z" fill="url(#steel)"/>
      <path d="M200 -14 L212 -1 L196 5 Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M6 -10 C58 -31 124 -33 166 -21" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M6 9 C64 10 130 9 192 3" stroke="#0B0E13" stroke-opacity="0.4" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>

  <text x="470" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="0.5" fill="#F4F7FA">Samurai AI</text>
  <text x="473" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="3.2" fill="#7C8896">AUTHORISED OPERATIONS · OPERATOR IN CHARGE</text>
</svg>
